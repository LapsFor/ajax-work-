<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <div class="container mt-5">
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow rounded-4 border-0">
                    <div class="card-body p-4">
                        
                        <!-- Сетка для полей -->
                        <div class="row g-2 align-items-end">
                            
                            <div class="col">
                                <label class="form-label text-muted small mb-1">Currency</label>
                                <select name="type" id="type" class="form-select">
                                    <option value="USD">US Dollar</option>
                                    <option value="EUR">EURO</option>
                                    <option value="PLN">Zloty</option>
                                    <option value="GBP">GB Pound</option>
                                </select>
                            </div>
                            
                            <div class="col">
                                <label class="form-label text-muted small mb-1">Start</label>
                                <input type="date" name="stdate" id="stdate" class="form-control">
                            </div>
                            
                            <div class="col">
                                <label class="form-label text-muted small mb-1">End</label>
                                <input type="date" name="exdate" id="exdate" class="form-control">
                            </div>
                            
                            <div class="col">
                                <button type="button" id="btn" class="btn btn-primary w-100">show</button>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>

    
        <div class="row">
            <div class="col-12">
                <div class="card shadow rounded-4 border-0">
                    <div class="card-body p-4">
                        <canvas id="exchangeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
